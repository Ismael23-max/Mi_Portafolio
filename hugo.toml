baseURL = "https://your_domain.com/"
locale = "en-us"
title = "Mi Portafolio"
theme = "blowfish"

summaryLength = 70

enableRobotsTXT = true
defaultContentLanguage = "en"
buildDrafts = false
buildFuture = false
enableEmoji = true

[pagination]
  pagerSize = 100

[imaging]
  anchor = "Center"


[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = "fragmentrefs"
      type = "fragments"
      weight = 10